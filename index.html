<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata Web - MindAR</title>

  <!-- A-Frame 1.4.2 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- MindAR 1.2.2 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script>
    // Componente personalizzato per gestire il click sull'immagine AR
    AFRAME.registerComponent('clickable-link', {
      init: function () {
        this.el.addEventListener('click', function () {
          window.location.href = 'https://online.fliphtml5.com/kyszr/Brochure-completa/';
        });
      }
    });
  </script>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="pag01Image" src="pag1.png">
    </a-assets>

    <!-- Fotocamera con il raycaster abilitato per rilevare il tap sullo schermo -->
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Piano con classe clickable e attributo clickable-link -->
      <a-plane 
        class="clickable"
        clickable-link
        src="#pag01Image" 
        position="0 0 0" 
        height="1" 
        width="0.707" 
        rotation="0 0 0">
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
