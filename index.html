<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata Web - MindAR</title>

  <!-- A-Frame versione stabile -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR per A-Frame versione stabile -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Scena AR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Immagine da sovrapporre -->
      <img id="pag01Image" src="./pag01.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Index 0 (Corrisponde al primo target dentro targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane 
        src="#pag01Image" 
        position="0 0 0" 
        height="1" 
        width="0.707" 
        rotation="0 0 0">
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
