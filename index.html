<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata Web - MindAR</title>

  <!-- A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script>
    // Componente per intercettare il tap direttamente sul piano 3D
    AFRAME.registerComponent('click-redirect', {
      init: function () {
        const url = 'https://online.fliphtml5.com/kyszr/Brochure-completa/';

        // Gestione evento Click (Android / Desktop)
        this.el.addEventListener('click', () => {
          window.location.href = url;
        });

        // Gestione evento Touch (iOS / Safari)
        this.el.addEventListener('touchstart', (e) => {
          e.preventDefault();
          window.location.href = url;
        });
      }
    });
  </script>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="pag01Image" src="pag1.png">
    </a-assets>

    <!-- Cursor configurato per rilevare i tocchi touch del display -->
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane 
        class="clickable"
        click-redirect
        src="#pag01Image" 
        position="0 0 0" 
        height="1" 
        width="0.707" 
        rotation="0 0 0">
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
