<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata Web - MindAR</title>

  <!-- A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <script>
    /*
     * Componente "tap-to-open":
     * ascolta il tocco su tutta la pagina e controlla con un raggio 3D
     * (raycaster) se il tocco colpisce il piano AR. Solo in quel caso
     * (e solo se il target è inquadrato) apre il link.
     * Non dipende da cursor/raycaster di A-Frame, che con MindAR
     * spesso non intercettano i tap.
     */
    AFRAME.registerComponent('tap-to-open', {
      schema: {
        url: { type: 'string' },
        target: { type: 'selector' },  // entità mindar-image-target
        plane: { type: 'selector' }    // piano cliccabile
      },

      init: function () {
        const self = this;
        this.found = false;
        this.opened = false;
        this.raycaster = new THREE.Raycaster();
        this.pointer = new THREE.Vector2();

        this.data.target.addEventListener('targetFound', function () {
          self.found = true;
        });
        this.data.target.addEventListener('targetLost', function () {
          self.found = false;
        });

        this.onTap = function (e) {
          if (!self.found || self.opened) return;

          const camera = self.el.camera;
          if (!camera) return;

          // Coordinate del tocco (mouse o dito)
          let x = e.clientX, y = e.clientY;
          if ((x === undefined || y === undefined) && e.changedTouches && e.changedTouches.length) {
            x = e.changedTouches[0].clientX;
            y = e.changedTouches[0].clientY;
          }
          if (x === undefined || y === undefined) return;

          // Conversione in coordinate normalizzate (-1 .. +1)
          self.pointer.x = (x / window.innerWidth) * 2 - 1;
          self.pointer.y = -(y / window.innerHeight) * 2 + 1;

          self.raycaster.setFromCamera(self.pointer, camera);
          const planeObj = self.data.plane.object3D;
          planeObj.updateMatrixWorld(true);
          const hits = self.raycaster.intersectObject(planeObj, true);

          if (hits.length > 0) {
            self.opened = true;
            window.location.href = self.data.url;
          }
        };

        // pointerup copre mouse, touch e penna (Android, iOS, desktop)
        document.addEventListener('pointerup', this.onTap, true);
      },

      remove: function () {
        document.removeEventListener('pointerup', this.onTap, true);
      }
    });
  </script>
</head>
<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes; uiLoading: yes;"
    tap-to-open="url: https://online.fliphtml5.com/kyszr/Brochure-completa/; target: #target0; plane: #brochurePlane"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="pag01Image" src="./pag1.png">
    </a-assets>

    <!-- Camera richiesta da MindAR -->
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse; fuse: false" raycaster="near: 0.01; far: 10000; objects: .clickable"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-plane
        id="brochurePlane"
        class="clickable"
        src="#pag01Image"
        position="0 0 0"
        height="1"
        width="0.707"
        rotation="0 0 0"
        material="transparent: true; shader: flat">
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
