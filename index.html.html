<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtà Aumentata Web - MindAR</title>

  <!-- Importazione A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.min.js"></script>
  <!-- Importazione MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Scena AR configurata con il file targets.mind -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Caricamento dell'immagine pag01.png -->
      <img id="pag01Image" src="./pag01.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Index 0 corrisponde alla prima immagine dentro targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Sovrapposizione dell'immagine pag01.png al riconoscimento del target -->
      <a-plane 
        src="#pag01Image" 
        position="0 0 0" 
        height="1" 
        width="0.707" 
        rotation="0 0 0">
      </a-plane>

    </a-entity>

  </a-scene>

</body>
</html>
